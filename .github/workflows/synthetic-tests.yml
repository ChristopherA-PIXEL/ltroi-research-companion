name: Synthetic model checks
on:
  pull_request:
  push:
    branches: [main, 'review/**']
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test docs/v2.3/test_model.cjs
